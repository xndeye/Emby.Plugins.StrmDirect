name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
            args+=("-p:Version=$version")
          fi
          dotnet build src/StrmDirect/StrmDirect.csproj -c Release "${args[@]}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          output="$PWD/src/StrmDirect/bin/Release/net8.0"
          runtime="$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^8\./ {gsub(/\[|\]/,"",$3); print $3 "/" $2}' | tail -1)"
          test -d "$runtime"
          mkdir -p artifacts
          dotnet tool run ilrepack "/out:$PWD/artifacts/StrmDirect.dll" /internalize "/lib:$output" "/lib:$runtime" \
            "$output/StrmDirect.dll" "$output/0Harmony.dll"
          test -s artifacts/StrmDirect.dll
          cp LICENSE artifacts/
          cp THIRD-PARTY-NOTICES.txt artifacts/
          (cd artifacts && sha256sum StrmDirect.dll > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: StrmDirect
          path: artifacts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: StrmDirect
          path: artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes
